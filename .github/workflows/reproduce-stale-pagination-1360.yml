name: Reproduce stale PR pagination issue 1360

on:
  workflow_dispatch:
    inputs:
      operations-per-run:
        description: 'operations-per-run value for this dispatch'
        default: '1000'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: v-chiranjib-swain/stale@e658c8b4f5728a73d8be77a5951c910270b2a87d
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-pr-labels: pagination-1360
          exempt-pr-labels: pagination-1360-exempt
          stale-pr-label: U:Stale
          stale-pr-message: ''
          close-pr-message: ''
          close-pr-label: ''
          days-before-pr-stale: 30
          days-before-pr-close: 0
          days-before-issue-stale: -1
          days-before-issue-close: -1
          operations-per-run: ${{ github.event.inputs.operations-per-run }}
          sort-by: created
          ascending: false
